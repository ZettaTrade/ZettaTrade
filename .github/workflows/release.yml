# T-125 - delivery pipeline: tagged releases produce self-contained
# per-OS artifacts on GitHub Releases.
#
# Trigger: a version tag (v*). The tag checkout's committed
# Directory.Build.props is the single version source: it is parsed at
# workflow level and cross-guarded against the tag name, so a tag that
# does not match the version commit fails loudly instead of shipping.
# The release notes are extracted verbatim from the matching
# '## [version]' CHANGELOG.md section of the same tree; a missing
# section fails the pipeline (a tag must ride the release commit that
# carries the bump).
#
# Artifacts: zettatrade-<version>-<rid>.<ext> - zip for win-x64,
# osx-x64 and osx-arm64, tar.gz for linux-x64 - the T-256 Inno Setup
# installer zettatrade-<version>-win-x64-setup.exe compiled on the
# windows leg, the T-257 platform-native doors on the other two OSes -
# zettatrade-<version>-<rid>.dmg built on the osx legs (the unsigned
# app bundle layout; the Gatekeeper caveat lives in docs/SECURITY.md)
# and zettatrade-<version>-linux-x64.AppImage plus
# zettatrade-<version>-linux-x64.deb built on the linux leg (desktop
# entry, the icon; the AppImage tool is a digest-pinned download) -
# plus one zettatrade-<version>-sha256.txt attached next to them.
#
# Code signing and notarization remain out of scope; docs/SECURITY.md
# records the hash-only artifact posture and what the signed follow-up
# will need. No product code changes and no secrets beyond the
# automatic GITHUB_TOKEN: packages: read restores the private Livery
# package (the Livery package grants this repository Actions access).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read # restore the private Livery package from GitHub Packages

jobs:
  package:
    name: package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # every leg's verdict stays visible
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   ext: ".zip" }
          - { os: macos-latest,   rid: osx-x64,   ext: ".zip" }
          - { os: macos-latest,   rid: osx-arm64, ext: ".zip" }
          - { os: ubuntu-latest,  rid: linux-x64, ext: ".tar.gz" }
    steps:
      # The tree at the tag: the version source and the build input in one.
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin the SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Authenticate the private package feed
        # The root nuget.config already pins the zettatrade source - add
        # refuses a duplicate name against the effective source list, so
        # the pinned source is updated in place with the run's
        # GITHUB_TOKEN. The credentials land in the checked-out copy
        # only; nothing is committed.
        run: dotnet nuget update source zettatrade --username ZettaTrade --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --configfile nuget.config

      - name: Parse the version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $props = Get-Content -Raw Directory.Build.props
          $prefix = [regex]::Match($props, '<VersionPrefix>([^<>]+)</VersionPrefix>').Groups[1].Value.Trim()
          $suffix = [regex]::Match($props, '<VersionSuffix>([^<>]+)</VersionSuffix>').Groups[1].Value.Trim()
          if (-not $prefix) { throw 'Directory.Build.props carries no <VersionPrefix>.' }
          $version = $prefix
          if ($suffix) { $version = "$prefix-$suffix" }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match the tag checkout's props version '$version'. Release tags follow the version commit (v$version)."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "Version: $version"

      - name: Publish self-contained
        run: dotnet publish src/ZettaTrade.App -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Smoke - the app host is present and carries the props version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $appHost = 'ZettaTrade.App'
          if ('${{ matrix.rid }}'.StartsWith('win-')) { $appHost = 'ZettaTrade.App.exe' }
          if (-not (Test-Path (Join-Path 'publish' $appHost))) { throw "$appHost is missing from the publish output." }
          $dllPath = Join-Path 'publish' 'ZettaTrade.App.dll'
          if (-not (Test-Path $dllPath)) { throw 'ZettaTrade.App.dll is missing from the publish output.' }
          # The embedded informational version is the props version, with
          # the baked source-revision tail ("0.2.0+<commit sha>"):
          # assert the props-version identity, the ordinal prefix does it.
          $assembly = [System.Reflection.Assembly]::LoadFrom($dllPath)
          $informational = [System.Attribute]::GetCustomAttribute($assembly, [System.Reflection.AssemblyInformationalVersionAttribute]).InformationalVersion
          if (-not $informational.StartsWith($version, [System.StringComparison]::Ordinal)) {
            throw "Embedded informational version '$informational' does not match the props version '$version'."
          }
          Write-Host "Smoke OK: $appHost present, embedded version '$informational' matches '$version'."
          $files = (Get-ChildItem publish -Recurse -File | Measure-Object).Count
          Write-Host "Publish output: $files files."

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $rid = '${{ matrix.rid }}'
          $ext = '${{ matrix.ext }}'
          $name = "zettatrade-$version-$rid$ext"
          if ($ext -eq '.tar.gz') {
            tar -czf $name -C publish .
          }
          else {
            Compress-Archive -Path 'publish/*' -DestinationPath $name
          }
          if (-not (Test-Path $name)) { throw "The archive for $rid was not produced." }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"
          Write-Host "Archive: $name ($([math]::Round((Get-Item $name).Length / 1MB, 2)) MiB)."

      - name: Upload the archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}

      - name: Stage the app bundle and build the .dmg (T-257)
        # hdiutil ships on macOS runners; the script stages the bundle
        # and lints the layout on any OS and builds the .dmg only where
        # hdiutil exists (a Windows dev box stays stage-only by design).
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/macos-dmg.ps1 -PublishDir publish -OutDir dmg-out -Rid '${{ matrix.rid }}'
          $version = '${{ steps.version.outputs.version }}'
          $dmg = "dmg-out/zettatrade-$version-${{ matrix.rid }}.dmg"
          if (-not (Test-Path $dmg)) { throw "The .dmg was not produced: $dmg" }
          Write-Host "Dmg artifact OK: $dmg"

      - name: Upload the .dmg artifact (T-257)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zettatrade-${{ steps.version.outputs.version }}-${{ matrix.rid }}.dmg
          path: dmg-out/zettatrade-*-osx-*.dmg

      - name: Package the Linux doors - AppImage and .deb (T-257)
        # appimagetool is fetched from the project's own release feed and
        # digest-pinned (the re-pin procedure lives in docs/SECURITY.md);
        # the FUSE-less runner gets the extract-and-run form. dpkg-deb
        # ships with the runner image. The scripts stage and lint on any
        # OS; each build runs only where its tool exists.
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The digest-pinned tool must sit on PATH named appimagetool -
          # that is the name the staging script probes for.
          $tool = Join-Path $env:RUNNER_TEMP 'appimagetool'
          Invoke-WebRequest -Uri 'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage' -OutFile $tool
          $hash = (Get-FileHash $tool -Algorithm SHA256).Hash
          if ($hash -ne 'E8C1169C4AF66C3184D7EE110713D4BE04BEFE671FA358E2C1591EE840553B03') {
            throw "The pinned appimagetool digest does not match: $hash. The continuous feed rebuilt - review the new build log linked on the release page, then re-pin the digest here and in docs/SECURITY.md."
          }
          chmod +x $tool
          $env:PATH = "$env:RUNNER_TEMP:$env:PATH"
          pwsh -NoProfile -File scripts/linux-appimage.ps1 -PublishDir publish -OutDir appimage-out
          pwsh -NoProfile -File scripts/linux-deb.ps1 -PublishDir publish -OutDir deb-out
          $version = '${{ steps.version.outputs.version }}'
          $appImage = "appimage-out/zettatrade-$version-linux-x64.AppImage"
          $deb = "deb-out/zettatrade-$version-linux-x64.deb"
          foreach ($door in @($appImage, $deb)) {
            if (-not (Test-Path $door)) { throw "The linux door was not produced: $door" }
            if ((Get-Item $door).Length -le 0) { throw "The linux door is empty: $door" }
          }
          Write-Host "Linux door artifacts OK: $appImage, $deb"

      - name: Install the .deb on the runner (T-257)
        # The CI-only acceptance the staging script cannot claim: the
        # package installs cleanly on the runner - the control parses,
        # the dependency floor resolves and the contract paths land.
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $deb = "deb-out/zettatrade-$version-linux-x64.deb"
          sudo dpkg -i $deb
          if ($LASTEXITCODE -ne 0) { throw "dpkg -i exited $LASTEXITCODE - the package did not install cleanly." }
          $status = & dpkg-query -W -f '${Status} ${Version}' zettatrade
          if ($status -ne "install ok installed $version") {
            throw "The zettatrade package is not cleanly installed: '$status' (expected 'install ok installed $version')."
          }
          if (-not (Test-Path /usr/bin/zettatrade)) { throw 'The contract door /usr/bin/zettatrade did not land.' }
          Write-Host "Deb install OK: $status"

      - name: Upload the AppImage artifact (T-257)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zettatrade-${{ steps.version.outputs.version }}-linux-x64.AppImage
          path: appimage-out/zettatrade-*-linux-x64.AppImage

      - name: Upload the .deb artifact (T-257)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zettatrade-${{ steps.version.outputs.version }}-linux-x64.deb
          path: deb-out/zettatrade-*-linux-x64.deb

      - name: Compile the Windows installer (T-256)
        # The T-256 smoke script carries the whole leg: the version parse
        # (the props, the pipeline's single version source), a fresh
        # self-contained publish, the publish smoke, the static lint of
        # windows-installer.iss (the data-safety and install-mode pins) and
        # the ISCC compile with the version-resource assert. Inno Setup
        # ships on the runner image; the choco fallback covers an image
        # that drops it. The compile is CI's job - a local run without
        # ISCC stays lint-only by design.
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-installer-smoke.ps1 -OutDir installer-out
          $version = '${{ steps.version.outputs.version }}'
          $name = "zettatrade-$version-win-x64-setup.exe"
          if (-not (Test-Path (Join-Path 'installer-out' $name))) { throw "The installer was not produced: $name" }
          Write-Host "Installer artifact OK: $name"

      - name: Upload the installer artifact
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: zettatrade-${{ steps.version.outputs.version }}-win-x64-setup
          path: installer-out/zettatrade-*-win-x64-setup.exe

  release-notes:
    name: release notes (CHANGELOG excerpt)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract the matching CHANGELOG section
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $props = Get-Content -Raw Directory.Build.props
          $prefix = [regex]::Match($props, '<VersionPrefix>([^<>]+)</VersionPrefix>').Groups[1].Value.Trim()
          $suffix = [regex]::Match($props, '<VersionSuffix>([^<>]+)</VersionSuffix>').Groups[1].Value.Trim()
          if (-not $prefix) { throw 'Directory.Build.props carries no <VersionPrefix>.' }
          $version = $prefix
          if ($suffix) { $version = "$prefix-$suffix" }
          $notes = [System.Collections.Generic.List[string]]::new()
          $inside = $false
          foreach ($line in (Get-Content CHANGELOG.md)) {
            if ($line -match '^## \[') {
              if ($inside) { break }
              if ($line.Contains("[$version]")) { $inside = $true }
            }
            if ($inside) { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) {
            throw "CHANGELOG.md carries no '## [$version]' section on this tag - tags ride the version commit that adds the matching section."
          }
          $notes | Set-Content -Path release-notes.md
          Write-Host "Release notes: $($notes.Count) lines extracted for $version."

      - name: Upload the release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  release:
    name: GitHub release
    needs: [package, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the archives
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: Smoke - every archive is present and non-empty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Get-Content -Raw dist/release-notes.md
          $match = [regex]::Match($notes, '^## \[([^\]]+)\]', 'Multiline')
          if (-not $match.Success) { throw 'release-notes.md carries no CHANGELOG section header.' }
          $version = $match.Groups[1].Value
          $expected = @()
          foreach ($rid in @('win-x64', 'osx-x64', 'osx-arm64')) {
            $expected += "zettatrade-$version-$rid.zip"
          }
          $expected += "zettatrade-$version-linux-x64.tar.gz"
          $expected += "zettatrade-$version-win-x64-setup.exe"
          $expected += "zettatrade-$version-osx-x64.dmg"
          $expected += "zettatrade-$version-osx-arm64.dmg"
          $expected += "zettatrade-$version-linux-x64.AppImage"
          $expected += "zettatrade-$version-linux-x64.deb"
          foreach ($name in $expected) {
            $file = Get-Item -LiteralPath (Join-Path 'dist' $name) -ErrorAction SilentlyContinue
            if (-not $file) { throw "Missing release artifact: $name" }
            if ($file.Length -le 0) { throw "Empty release artifact: $name" }
          }
          Write-Host "All $($expected.Count) archives present for $version."

      - name: SHA-256 sums next to the archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Get-Content -Raw dist/release-notes.md
          $version = [regex]::Match($notes, '^## \[([^\]]+)\]', 'Multiline').Groups[1].Value
          $lines = @(Get-ChildItem dist -File |
            Where-Object { $_.Name -like 'zettatrade-*' -and $_.Name -notlike '*-sha256.txt' } |
            Sort-Object Name |
            ForEach-Object { "$(Get-FileHash -Algorithm SHA256 $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" })
          if ($lines.Count -eq 0) { throw 'No archives in dist/ to hash.' }
          $sums = "dist/zettatrade-$version-sha256.txt"
          $lines | Set-Content -Path $sums
          Get-Content $sums | Write-Host

      - name: Create the GitHub release and attach the artifacts
        run: gh release create "${GITHUB_REF_NAME}" dist/zettatrade-* --title "ZettaTrade ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
