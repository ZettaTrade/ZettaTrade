name: metrics

# The public metrics page (T-129): the generated page rides the docs-site
# deploy. The generator is static and public-API-only; the failure policy is
# refused-not-defaulted (docs/ALPHA-PROGRAM.md) — a failed API call fails the
# run and the previous page stands.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the metrics page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: ./scripts/generate-metrics.ps1

      - name: Commit the rendered page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-site/public/metrics/index.html
          if git diff --cached --quiet; then
            echo "No metric changes; nothing to commit."
          else
            git commit -m "docs(metrics): regenerate the public metrics page"
            git push
          fi
