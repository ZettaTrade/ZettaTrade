<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The ZettaTrade product mark (T-162): the rounded brand tile with the
       stroked Z monogram, drawn in a 64x64 design space. The shipped ICO
       (Assets/ZettaTrade.ico) renders these same fractions at every
       taskbar-ready size - scripts/make-brand-ico.ps1 regenerates it; the
       title-bar strip rides the palette-tinted Path twins of this geometry
       (divide by four: the 16px slot speaks the same shape). -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#1E40AF"/>
  <path d="M20 20 H44 L20 44 H44"
        fill="none" stroke="#F5F7FA" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
