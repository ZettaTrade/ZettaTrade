# ZettaTrade gitleaks configuration (T-117).
#
# Extends the default gitleaks ruleset picked up by the binary bundled in
# .github/workflows/security.yml. The global allowlist below is the ONLY
# carve-out and it covers exactly the known dummy test fixtures identified
# during the 2026-11-06 full-history audit (see docs/SECURITY.md).
#
# Allowlist contract: every entry is a sample-shaped string owned by a named
# fixture file. Sample-shaped strings only, never real credentials. A new
# entry is added only for a confirmed fixture, with its file and purpose
# named in the description. Anything outside these literals is a finding:
# revoke-and-rotate per docs/SECURITY.md (history rewrite only by an explicit
# supervisor decision).
#
# The entries carry NO path scoping on purpose: a global allowlist combines
# paths and regexes with OR, so a path entry would become a blanket
# "anything inside a directory" carve-out. The regexes themselves are bound
# tightly to the fixture literals instead.

title = "ZettaTrade gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """
Known dummy test fixtures only (sample-shaped strings, never real credentials):
- "secret://<name>" auth-secret references - the ISecretStore pointer scheme,
  never a raw value: tests/ZettaTrade.App.Tests/Mcp/McpServerConfigListTests.cs,
  tests/ZettaTrade.App.Tests/Mcp/McpClientServiceTests.cs,
  tests/ZettaTrade.App.Tests/Mcp/McpClientManagerTests.cs and the
  IMcpClient.AuthSecretRef doc example in src/ZettaTrade.Core/Interfaces.
- "live-secret" - the McpClientServiceTests.StoredSecret literal.
- "t-049-master-passphrase" - the EncryptedFileSecretStoreRulesTests local
  master passphrase (T-049 harness, temp-dir store).
- "Tape.A11yWithSymbol" - the trade tape's localization template-key literal in
  src/ZettaTrade.UI/Charting/WidgetAccessibilityNames.cs (the TapeWithSymbolKey
  constant): the default generic-api-key rule trips on the const-assignment
  shape (an identifier ending in Key followed by a string), not on any
  credential (the 2026-11-14 nightly triage).
- "api_key=abc123def456" - the synthetic redaction log line in
  tests/ZettaTrade.App.Tests/Services/LogTailServiceTests.cs (the
  parser fixture: a fake query string the redactor must scrub).
- the T-117 industry token probe shapes (the AnIndustryTokenShape_Redacts
  InlineData fixtures of tests/ZettaTrade.App.Tests/Services/LogRedactorTests.cs,
  placeholder digits only): "ghp_0123456789abcdef0123456789abcdef1234" and
  "AIzaSyA0123456789abcdefghijklmnopqrstuv" fired the 2026-11-14 nightly
  (github-pat, gcp-api-key); the remaining probe shapes ride defensively.
Anything else is a finding: revoke-and-rotate per docs/SECURITY.md.
"""
regexTarget = "match"
regexes = [
  '''(?i)secret\://[a-z0-9][a-z0-9_-]{0,31}''',
  '''(?i)\blive-secret\b''',
  '''(?i)\bt-049-master-passphrase\b''',
  '''(?i)\bTape\.A11yWithSymbol\b''',
  '''(?i)\bapi_key=abc123def456\b''',
  '''(?i)\bghp_0123456789abcdef0123456789abcdef1234\b''',
  '''(?i)\bAKIAIOSFODNN7EXAMPLE912345678\b''',
  '''(?i)\bsk-proj-abcdef1234567890abcdef12\b''',
  '''(?i)\bxoxb-1234567890-abcdef\b''',
  '''(?i)\bAIzaSyA0123456789abcdefghijklmnopqrstuv\b''',
  '''(?i)\beyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxIn0\.SignaturePart1\b''',
]
